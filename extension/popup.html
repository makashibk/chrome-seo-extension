<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pure SEO</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <img class="brand-icon" src="icons/icon128.png" width="24" height="24" alt="">
        <span class="brand-name">Pure SEO</span>
      </div>
      <div class="inspect-bar">
        <svg class="inspect-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span class="page-url" id="pageUrl" title=""></span>
        <button class="copy-url-btn" id="copyUrlBtn" title="Copy URL" aria-label="Copy URL">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16 1H4a2 2 0 00-2 2v14h2V3h12V1zm3 4H8a2 2 0 00-2 2v14a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2zm0 16H8V7h11v14z"/></svg>
        </button>
      </div>
      <div class="export-wrap" id="exportWrap">
        <button class="export-btn" id="exportBtn" aria-haspopup="menu" aria-expanded="false" title="Export full report">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg><span>Report</span>
        </button>
        <div class="export-menu" id="exportMenu" role="menu">
          <button role="menuitem" data-export="html"><b>Readable report</b><span>HTML file with issues and fixes. Prints to PDF.</span></button>
          <button role="menuitem" data-export="xlsx"><b>Spreadsheet</b><span>Excel file, one sheet per section.</span></button>
        </div>
      </div>
    </header>
    <div id="body">
      <aside id="sidebar">
        <nav class="sidebar-nav" id="sidebarNav" role="tablist" aria-label="Report sections">
          <div class="nav-group-label">On-page</div>
          <button class="nav-item active" data-tab="content" role="tab">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm4 18H6V4h7v5h5v11zM8 12h8v2H8zm0 4h8v2H8z"/></svg>
            Content
          </button>
          <button class="nav-item" data-tab="images" role="tab">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm0 16H5V5h14v14zm-5.04-6.71l-2.75 3.54-1.96-2.36L6.5 17h11l-3.54-4.71z"/></svg>
            Images
          </button>
          <button class="nav-item" data-tab="outgoing-links" role="tab">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7a5 5 0 000 10h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4a5 5 0 000-10z"/></svg>
            Links
          </button>
          <div class="nav-group-label">Indexing</div>
          <button class="nav-item" data-tab="indexability" role="tab">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            Indexability
          </button>
          <button class="nav-item" data-tab="raw-rendered" role="tab">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9.01 14H2v2h7.01v3L13 15l-3.99-4v3zm5.98-1v-3H22V8h-7.01V5L11 9l3.99 4z"/></svg>
            Raw vs rendered
          </button>
          <button class="nav-item" data-tab="http-headers" role="tab">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            <span class="nav-label">HTTP headers</span><span class="nav-badge" id="statusBadge">&mdash;</span>
          </button>
          <div class="nav-group-label">Enhancements</div>
          <button class="nav-item" data-tab="structured-data" role="tab">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
            Structured data
          </button>
          <button class="nav-item" data-tab="social-tags" role="tab">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11A2.99 2.99 0 0021 5a3 3 0 10-5.91.7L8.04 9.81A2.99 2.99 0 003 12a3 3 0 005.04 2.19l7.12 4.16c-.05.21-.08.43-.08.65A2.92 2.92 0 1018 16.08z"/></svg>
            Social tags
          </button>
        </nav>
        <div class="sidebar-footer">
          <button class="nav-item" data-tab="settings" role="tab">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 000-1.88l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96a7.03 7.03 0 00-1.62-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84a.48.48 0 00-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.73 8.87a.48.48 0 00.12.61l2.03 1.58a7.07 7.07 0 000 1.88l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 00-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg>
            Settings
          </button>
          <div class="sidebar-version">v1.5.1 by <a href="https://github.com/makashibk/chrome-seo-extension" target="_blank" rel="noopener">MakashibK</a></div>
        </div>
      </aside>
      <main id="contentArea">
        <div class="loading" id="loading"><div class="spinner"></div><p>Analyzing page</p></div>
      </main>
    </div>
  </div>
  <script src="extract.js"></script>
  <script src="robots.js"></script>
  <script src="renderers.js"></script>
  <script src="popup.js"></script>
</body>
</html>
